<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Brand - CK TechFix Lusaka</title>
    <style>
        /* --- CSS VARIABLES (Matching your Home Page) --- */
        :root {
            --brand-dark-blue: #0A1C3A;
            --brand-blue: #0047AB;
            --brand-cyan: #00A8E8;
            --text-dark: #1A1A1A;
            --text-light: #666666;
            --bg-light: #F8F9FA;
            --white: #FFFFFF;
        }

        /* --- GLOBAL RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* --- HEADER / NAV --- */
        header {
            background-color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--brand-dark-blue);
        }

        .logo-img {
            height: 40px;
            margin-right: 10px;
            background: var(--brand-blue);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* --- PAGE CONTAINER --- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- PROGRESS BAR --- */
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 50px 0;
            position: relative;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #E0E0E0;
            z-index: 1;
            transform: translateY(-50%);
        }

        /* The blue progress line */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 33%; /* 1/3 of the way */
            height: 4px;
            background-color: var(--brand-blue);
            z-index: 1;
            transform: translateY(-50%);
        }

        .step {
            background-color: #E0E0E0;
            color: var(--text-light);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 2;
            position: relative;
        }

        .step.active {
            background-color: var(--brand-blue);
            color: var(--white);
        }

        .step-label {
            position: absolute;
            top: 45px;
            font-size: 0.85rem;
            color: var(--text-light);
            white-space: nowrap;
        }

        .step.active + .step-label {
            color: var(--brand-blue);
            font-weight: bold;
        }

        /* --- BACK BUTTON & HEADING --- */
        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .back-btn {
            background-color: #E6F0FA; /* Light blue background */
            color: var(--brand-blue);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #D0E4F7;
        }

        .header-row h1 {
            font-size: 1.8rem;
            color: var(--text-dark);
            font-weight: 400;
        }

        .header-row h1 strong {
            font-weight: 700;
        }

        /* --- SEARCH INPUT SECTION --- */
        .search-section {
            background-color: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .search-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .search-label::before {
            content: '';
            width: 10px;
            height: 10px;
            background-color: var(--brand-blue);
            border-radius: 50%;
            display: inline-block;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            flex-grow: 1;
            display: flex;
            align-items: center;
            border: 2px solid var(--brand-cyan);
            border-radius: 8px;
            padding: 10px 15px;
            background-color: var(--white);
            position: relative;
        }

        .search-box input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .search-box input::placeholder {
            color: #A0A0A0;
        }

        .search-icon-btn {
            background-color: #E6F0FA;
            border: none;
            color: var(--brand-blue);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .device-icon {
            width: 30px;
            height: 50px;
            border: 2px solid var(--brand-blue);
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .device-icon::before {
            content: '';
            width: 10px;
            height: 2px;
            background-color: var(--brand-blue);
            position: absolute;
            bottom: 3px;
        }

        /* --- BRAND GRID --- */
        .brand-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .brand-section-title::before {
            content: '';
            width: 10px;
            height: 10px;
            background-color: var(--brand-blue);
            border-radius: 50%;
            display: inline-block;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .brand-card {
            background-color: var(--white);
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .brand-card:hover {
            border-color: var(--brand-cyan);
            box-shadow: 0 5px 15px rgba(0, 168, 232, 0.1);
            transform: translateY(-2px);
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Custom styles for specific brand names to make them look like logos */
        .brand-logo.samsung { font-family: 'Arial', sans-serif; font-weight: 900; letter-spacing: -0.5px; }
        .brand-logo.apple { font-family: 'Helvetica', sans-serif; font-weight: 300; letter-spacing: 0px; }
        .brand-logo.tecno { font-family: 'Arial', sans-serif; font-style: italic; font-weight: 900; }
        .brand-logo.infinix { font-family: 'Arial', sans-serif; font-weight: 700; }
        .brand-logo.itel { font-family: 'Arial', sans-serif; font-weight: 900; }
        .brand-logo.huawei { font-family: 'Arial', sans-serif; font-weight: 700; }
        .brand-logo.nokia { font-family: 'Arial', sans-serif; font-weight: 900; letter-spacing: 2px; }

        /* --- FOOTER --- */
        footer {
            background-color: #061224;
            color: #8892B0;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: 40px;
        }

        /* --- MEDIA QUERIES --- */
        @media (max-width: 480px) {
            .brand-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .brand-card {
                padding: 15px 10px;
                min-height: 80px;
            }
            .brand-logo {
                font-size: 1.1rem;
            }
            .header-row h1 {
                font-size: 1.4rem;
            }
            .search-box-wrapper {
                flex-direction: row;
            }
            .device-icon {
                display: none; /* Hide the phone icon on very small screens to save space */
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <div class="logo-img">CK TechFix</div>
        </div>
    </header>

    <div class="container">
        <!-- PROGRESS BAR -->
        <div class="progress-bar">
            <div class="step active">1
                <span class="step-label">Devices</span>
            </div>
            <div class="step">2
                <span class="step-label">Repairs</span>
            </div>
            <div class="step">3
                <span class="step-label">Finalize</span>
            </div>
        </div>

        <!-- BACK BUTTON & HEADING -->
        <div class="header-row">
            <a href="index.html" class="back-btn">&#8592;</a> <!-- Back arrow -->
            <h1>Which <strong>model</strong> do you have?</h1>
        </div>

        <!-- SEARCH SECTION -->
        <div class="search-section">
            <div class="search-label">Type in your brand, model or model code.</div>
            <div class="search-box-wrapper">
                <div class="search-box">
                    <input type="text" id="deviceSearch" placeholder="iPhone 12 Pro Max">
                    <button class="search-icon-btn" onclick="searchDevice()">🔍</button>
                </div>
                <!-- Phone Icon Graphic -->
                <div class="device-icon"></div>
            </div>
        </div>

        <!-- BRAND SELECTION GRID -->
        <div class="brand-section-title">Or select your brand</div>
        
        <div class="brand-grid">
            <!-- Note: The "data-brand" attribute is what we will use to send them to the next page -->
            <div class="brand-card" onclick="selectBrand('Samsung')">
                <div class="brand-logo samsung">SAMSUNG</div>
            </div>
            <div class="brand-card" onclick="selectBrand('TECNO')">
                <div class="brand-logo tecno">TECNO</div>
            </div>
            <div class="brand-card" onclick="selectBrand('Infinix')">
                <div class="brand-logo infinix">Infinix</div>
            </div>
            <div class="brand-card" onclick="selectBrand('iPhone / Apple')">
                <div class="brand-logo apple">Apple</div>
            </div>
            <div class="brand-card" onclick="selectBrand('Huawei')">
                <div class="brand-logo huawei">HUAWEI</div>
            </div>
            <div class="brand-card" onclick="selectBrand('itel')">
                <div class="brand-logo itel">itel</div>
            </div>
            <div class="brand-card" onclick="selectBrand('Xiaomi / Redmi')">
                <div class="brand-logo">Xiaomi</div>
            </div>
            <div class="brand-card" onclick="selectBrand('OPPO')">
                <div class="brand-logo">OPPO</div>
            </div>
            <div class="brand-card" onclick="selectBrand('vivo')">
                <div class="brand-logo">vivo</div>
            </div>
            <div class="brand-card" onclick="selectBrand('Nokia')">
                <div class="brand-logo nokia">NOKIA</div>
            </div>
            <div class="brand-card" onclick="selectBrand('HONOR')">
                <div class="brand-logo">HONOR</div>
            </div>
            <div class="brand-card" onclick="selectBrand('realme')">
                <div class="brand-logo">realme</div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 CK TechFix. All rights reserved.</p>
        <p style="margin-top: 10px; font-size: 0.8rem;">Doorstep Tech Guru - Lusaka, Zambia</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // Function to handle the search button
        function searchDevice() {
            const input = document.getElementById('deviceSearch').value;
            if(input) {
                // In a real app, this would redirect to a results page
                alert(`Searching for repairs for: ${input}\n\n(Next step: Show repair options for this device)`);
            } else {
                alert("Please type in a device model first.");
            }
        }

        // Allow pressing "Enter" in the search box
        document.getElementById('deviceSearch').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchDevice();
            }
        });

        // Function to handle selecting a brand from the grid
        function selectBrand(brandName) {
            // Save the selected brand to the browser's local storage so the next page can use it
            localStorage.setItem('selectedBrand', brandName);
            
            // In a real app, this would redirect to "repairs.html"
            alert(`You selected: ${brandName}\n\n(In a real app, this would take you to Step 2: Choose Repair Type)`);
            
            // Uncomment the line below when you have the next page ready:
            // window.location.href = 'repairs.html'; 
        }
    </script>

</body>
</html>
